apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Backward-compatibility alias.
#
# Historically `k8s/base` was the OpenShift base. After the multi-platform
# consolidation, the canonical location is `k8s/overlays/openshift/base`.
# This file exists only so that existing CI/scripts that pass
# `KUSTOMIZE_DIR=k8s/base` keep working with no changes.
#
# Prefer `KUSTOMIZE_DIR=k8s/overlays/openshift/base` (or let the new
# Makefile pick it for you via `PLATFORM=openshift`) in new work.
resources:
  - ../overlays/openshift/base
