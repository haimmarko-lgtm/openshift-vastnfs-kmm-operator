apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay for reinstall scenarios where VAST NFS is already loaded
# This removes inTreeModulesToRemove to prevent conflicts with already-loaded VAST NFS modules

resources:
  - ../base

patches:
  # Remove inTreeModulesToRemove for reinstall scenarios
  # When VAST NFS is already loaded, we don't need to unload in-tree modules
  - target:
      kind: Module
      name: vastnfs
    patch: |-
      - op: remove
        path: /spec/moduleLoader/container/inTreeModulesToRemove
